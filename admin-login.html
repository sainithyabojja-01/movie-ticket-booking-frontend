<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Movie Booking</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            font-family: Arial, sans-serif;
            color: white;
        }

        .login-box {
            width: 90%;
            max-width: 400px;
            background: #1e293b;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid #475569;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #ef4444;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #dc2626;
        }

        #message {
            margin-top: 15px;
            color: #fca5a5;
        }

        a {
            color: #93c5fd;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>Admin Login</h1>
        <p>Movie Ticket Booking System</p>

        <form id="loginForm">
            <input
                type="text"
                id="username"
                placeholder="Admin Username"
                autocomplete="username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Admin Password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Login</button>
        </form>

        <p id="message"></p>
        <p><a href="index.html">Back to Booking Website</a></p>
    </div>

    <script>
        const form = document.getElementById("loginForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            message.textContent = "Checking login...";

            try {
                const response = await fetch(
                    "http://localhost:8080/api/bookings",
                    {
                        method: "GET",
                        headers: {
                            "Authorization": "Basic " +
                                btoa(username + ":" + password)
                        }
                    }
                );

                if (!response.ok) {
                    throw new Error("Invalid username or password");
                }

                message.style.color = "#86efac";
                message.textContent = "Login successful!";

                // Temporary local demo only.
                // A secure dashboard login requires backend-managed sessions.
                sessionStorage.setItem(
                    "adminDemoCredentials",
                    btoa(username + ":" + password)
                );

                window.location.href = "admin.html";

            } catch (error) {
                message.style.color = "#fca5a5";
                message.textContent =
                    "Login failed. Check username and password.";
            }
        });
    </script>

</body>
</html>
